<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Espectrómetro Espectro-IA</title>
    <!-- Importamos Chart.js para los gráficos (Reemplazo de Matplotlib) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .sidebar h2 { font-size: 18px; border-bottom: 1px solid #7f8c8d; padding-bottom: 10px; }
        .btn {
            display: block; width: 100%; padding: 10px; margin: 10px 0;
            background-color: #f39c12; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .btn:hover { background-color: #e67e22; }
        .btn-blue { background-color: #2980b9; }
        .btn-blue:hover { background-color: #3498db; }
        .btn-danger { background-color: #c0392b; }
        
        .main-content {
            flex-grow: 1; margin-left: 20px;
            background-color: white; padding: 20px;
            border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .color-box-container {
            display: flex; align-items: center; margin-top: 20px;
        }
        #colorBox {
            width: 100px; height: 100px; background-color: black;
            border: 2px solid #ccc; border-radius: 10px; margin-right: 20px;
        }
        .status { margin-top: 20px; font-size: 12px; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Control Espectral</h2>
        <button class="btn" id="btnMonitor">Iniciar Monitoreo</button>
        <button class="btn" id="btnDark">Grabar Negro</button>
        <button class="btn" id="btnBlank">Grabar Blanco</button>
        <button class="btn" id="btnSample">Grabar Muestra</button>
        
        <h2 style="margin-top: 30px;">Análisis</h2>
        <button class="btn btn-blue" id="btnAbsorbance">Ver Absorbancia</button>
        <button class="btn btn-blue" id="btnColor">Calcular Color</button>
        <button class="btn btn-blue" id="btnExport">Exportar CSV</button>
        
        <button class="btn btn-danger" id="btnStop">Detener / Limpiar</button>

        <div class="status" id="statusPanel">
            Blanco: No guardado<br>
            Negro: No guardado<br>
            Muestra: No guardada
        </div>
    </div>

    <div class="main-content">
        <h2 id="chartTitle">Respuesta Espectral</h2>
        <canvas id="spectroChart" width="800" height="400"></canvas>
        
        <div class="color-box-container">
            <div id="colorBox"></div>
            <div>
                <h3>Color Estimado</h3>
                <p id="rgbText">RGB: (0, 0, 0)</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
