<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Espectros</title>
    <!-- Cargamos Chart.js y SQL.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; }
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
        }
        .btn-group { display: flex; flex-direction: column; gap: 5px; }
        .btn-row { display: flex; gap: 5px; }
        label { font-weight: bold; font-size: 0.9em; margin-bottom: 2px; color:#2c3e50;}
        input, select { font-size: 0.85em; padding: 5px; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 0.85em;
        }
        button:hover { background-color: #2980b9; }
        button.orange { background-color: #e67e22; }
        button.orange:hover { background-color: #d35400; }
        
        .progress-container { margin: 15px 0; display: none; }
        progress { width: 100%; height: 20px; }
        #status-text { text-align: center; font-weight: bold; color: #e67e22; }

        .chart-container { position: relative; margin: auto; height: 40vh; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Analizador de Espectros</h1>

    <!-- Panel de Controles SQLite -->
    <div class="control-panel">
        
        <div class="btn-group">
            <label>1. Base de Datos SQLite (.db):</label>
            <input type="file" id="file-db" accept=".db,.sqlite">
        </div>
        
        <div class="btn-group">
            <label>2. Buscar en Tabla:</label>
            <div class="btn-row">
                <select id="select-tabla" style="flex:1;">
                    <option value="blancos">Blancos</option>
                    <option value="negros">Negros</option>
                    <option value="muestras">Muestras</option>
                </select>
                <button id="btn-listar">Listar</button>
            </div>
        </div>

        <div class="btn-group">
            <label>3. Seleccionar Registro:</label>
            <select id="select-registros">
                <option value="">-- Sin datos --</option>
            </select>
        </div>

        <div class="btn-group">
            <label>4. Cargar a la Memoria como:</label>
            <div class="btn-row">
                <button id="btn-cargar-blanco" style="background:#9b59b6;">Blanco</button>
                <button id="btn-cargar-negro" style="background:#34495e;">Negro</button>
                <button id="btn-cargar-muestra" style="background:#2ecc71;">Muestra</button>
            </div>
        </div>

        <div class="btn-group" style="justify-content: flex-end;">
            <button id="btn-conectar" style="background-color: #27ae60;">Conectar Hardware</button>
            <button id="btn-enviar" class="orange">Enviar Datos</button>
        </div>
    </div>

    <!-- Barra de progreso original -->
    <div class="progress-container" id="progreso-bloque">
        <div id="status-text">GRABANDO...</div>
        <progress id="progreso-barra" value="0" max="100"></progress>
    </div>

    <!-- Contenedor del Gráfico original -->
    <div class="chart-container">
        <canvas id="espectroChart"></canvas>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
