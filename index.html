<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Espectrómetro Espectro-IA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Agregamos SQL.js para leer SQLite en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 95vh;
        }
        .sidebar h2 { font-size: 16px; border-bottom: 1px solid #7f8c8d; padding-bottom: 8px; margin-top: 25px; }
        .sidebar h2:first-child { margin-top: 0; }
        
        .btn {
            display: block; width: 100%; padding: 8px; margin: 8px 0;
            background-color: #f39c12; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .btn:hover { background-color: #e67e22; }
        .btn-blue { background-color: #2980b9; }
        .btn-blue:hover { background-color: #3498db; }
        .btn-green { background-color: #27ae60; }
        .btn-green:hover { background-color: #2ecc71; }
        .btn-danger { background-color: #c0392b; }
        .btn-purple { background-color: #8e44ad; }
        .btn-purple:hover { background-color: #9b59b6; }
        
        select, input[type="text"] {
            width: 100%; padding: 6px; margin: 5px 0 10px 0; border-radius: 4px; border: 1px solid #ccc;
        }

        .main-content {
            flex-grow: 1; margin-left: 20px;
            background-color: white; padding: 20px;
            border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .status { margin-top: 20px; font-size: 12px; color: #bdc3c7; background: #34495e; padding: 10px; border-radius: 5px; }

        /* VISTAS INTERCAMBIABLES */
        #viewMonitor { display: block; }
        
        #viewColorAnalysis { 
            display: none; 
            grid-template-columns: 1.5fr 1fr; 
            grid-template-rows: auto auto;
            gap: 20px;
            height: 100%;
        }

        .panel { 
            border: 1px solid #eee; border-radius: 8px; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
        }
        .panel h3 { margin-top: 0; font-size: 15px; color: #333; margin-bottom: 10px;}
        
        #panelChromaticity { grid-column: 1 / 2; grid-row: 1 / 3; }
        #panelDistribution { grid-column: 2 / 3; grid-row: 1 / 2; }
        #panelColorBox { grid-column: 2 / 3; grid-row: 2 / 3; }

        .canvas-container { position: relative; width: 100%; }

        #colorBoxDisplay {
            width: 150px; height: 150px; background-color: black;
            border: 1px solid #ccc; margin: 10px 0;
        }
        .srgb-val { background: gray; color: white; padding: 5px 10px; font-family: monospace; font-size: 14px; margin-top: 10px; }
        
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- BASE DE DATOS -->
        <h2>📂 Base de Datos SQLite</h2>
        <input type="file" id="fileDB" accept=".db,.sqlite" style="display: none;">
        <button class="btn btn-purple" onclick="document.getElementById('fileDB').click()">📥 Cargar muestras_espectro.db</button>
        <button class="btn btn-purple" id="btnExportDB" style="display: none;">💾 Descargar BD Actualizada</button>

        <h2>🔍 Cargar desde BD</h2>
        <select id="dbTableSelect">
            <option value="blancos">Tabla: Blancos</option>
            <option value="negros">Tabla: Negros</option>
            <option value="muestras">Tabla: Muestras</option>
        </select>
        <button class="btn btn-green" id="btnListDB">Listar Registros</button>
        
        <select id="dbRecordSelect">
            <option value="">-- Sin registros --</option>
        </select>
        <button class="btn btn-green" id="btnLoadRecord">Cargar Registro Seleccionado</button>

        <h2>🔴 Control en Vivo (Grabar en BD)</h2>
        <button class="btn" id="btnMonitor">Iniciar Monitoreo</button>
        <button class="btn" id="btnDark">Grabar Negro en BD</button>
        <button class="btn" id="btnBlank">Grabar Blanco en BD</button>
        <button class="btn" id="btnSample">Grabar Muestra en BD</button>

        <h2>📊 Análisis</h2>
        <button class="btn btn-blue" id="btnAbsorbance">Ver Absorbancia</button>
        <button class="btn btn-blue" id="btnColor">Color Espectral</button>
        
        <button class="btn btn-danger" id="btnStop">Detener / Limpiar</button>

        <div class="status" id="statusPanel">
            <strong>Estado de Datos en RAM:</strong><br><br>
            Blanco: ❌ Vacío<br>
            Negro: ❌ Vacío<br>
            Muestra: ❌ Vacía
        </div>
    </div>

    <div class="main-content">
        <div id="viewMonitor">
            <h2 id="chartTitle">Respuesta Espectral</h2>
            <div class="canvas-container" style="height: 450px;">
                <canvas id="spectroChart"></canvas>
            </div>
        </div>

        <div id="viewColorAnalysis">
            <div class="panel" id="panelChromaticity">
                <h3>Diagrama de Cromaticidad CIE1976UCS</h3>
                <div class="canvas-container" id="chromaContainer">
                    <canvas id="chromaticityChart"></canvas>
                </div>
            </div>
            
            <div class="panel" id="panelDistribution">
                <h3>Distribución Espectral</h3>
                <div class="canvas-container" style="height: 250px;">
                    <canvas id="distributionChart"></canvas>
                </div>
            </div>

            <div class="panel" id="panelColorBox">
                <h3>Color Espectral</h3>
                <div id="colorBoxDisplay"></div>
                <div class="srgb-val" id="srgbText">SRGB= [0.000, 0.000, 0.000]</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
