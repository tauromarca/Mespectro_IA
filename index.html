<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Espectros (SQLite Web)</title>
    <!-- Chart.js para los gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SQL.js para procesar la base de datos SQLite en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; }
        .control-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #dcdde1;
        }
        .box h3 { margin-top: 0; color: #2980b9; margin-bottom: 10px; font-size: 16px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .form-row input, .form-row select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button {
            background-color: #3498db; color: white; border: none; padding: 10px;
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.orange { background-color: #e67e22; }
        button.orange:hover { background-color: #d35400; }
        button.green { background-color: #2ecc71; }
        button.purple { background-color: #9b59b6; width: 100%; margin-top: 10px; }
        
        .chart-container { position: relative; margin: auto; height: 40vh; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>Analizador de Espectros (SQLite)</h1>

    <div class="control-panel">
        
        <!-- SECCIÓN 1: CARGAR LA BASE DE DATOS -->
        <div class="box">
            <h3>📂 1. Cargar Base de Datos (muestras_espectro.db)</h3>
            <input type="file" id="file-db" accept=".db,.sqlite">
            <button class="purple" onclick="descargarBD()">💾 Descargar BD Actualizada (Guardar cambios locales)</button>
        </div>

        <!-- SECCIÓN 2: BUSCAR Y CARGAR REGISTROS EXISTENTES -->
        <div class="box">
            <h3>🔍 2. Buscar y Visualizar desde Base de Datos</h3>
            <div class="form-row">
                <select id="select-tabla-buscar">
                    <option value="blancos">Blancos</option>
                    <option value="negros">Negros</option>
                    <option value="muestras">Muestras</option>
                </select>
                <button onclick="listarRegistros()">Listar Registros</button>
            </div>
            <div class="form-row">
                <select id="select-registros"><option>-- Sin registros cargados --</option></select>
                <button class="orange" onclick="cargarRegistroAlGrafico()">⬇️ Cargar al Gráfico</button>
            </div>
        </div>

        <!-- SECCIÓN 3: CONTROL DE HARDWARE Y NUEVA LECTURA -->
        <div class="box">
            <h3>📡 3. Lectura de Hardware</h3>
            <div class="form-row">
                <button id="btn-conectar" class="green">Conectar Hardware</button>
                <button id="btn-enviar" class="orange">Simular / Leer Hardware (288 datos)</button>
            </div>
        </div>

        <!-- SECCIÓN 4: GUARDAR NUEVA LECTURA EN LA BD -->
        <div class="box">
            <h3>💾 4. Grabar Lectura en Base de Datos</h3>
            <div class="form-row">
                <input type="text" id="input-nombre" placeholder="Nombre (ej. Lote_1)">
                <input type="number" id="input-codigo" placeholder="Cód. Fermentación">
                <input type="number" step="0.01" id="input-ph" placeholder="pH">
                <input type="number" step="0.001" id="input-densidad" placeholder="Densidad">
                <input type="number" step="0.1" id="input-alcohol" placeholder="Alcohol">
            </div>
            <div class="form-row">
                <button onclick="grabarRegistroDB('negros')">Grabar como Negro</button>
                <button onclick="grabarRegistroDB('blancos')">Grabar como Blanco</button>
                <button onclick="grabarRegistroDB('muestras')">Grabar como Muestra</button>
            </div>
        </div>

    </div>

    <!-- Contenedor del Gráfico -->
    <div class="chart-container">
        <canvas id="espectroChart"></canvas>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
